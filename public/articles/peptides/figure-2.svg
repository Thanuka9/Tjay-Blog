<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="780" fill="none"></rect>
  <text x="700" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#2F4A48">How far has each peptide climbed?</text>
  <text x="700" y="100" text-anchor="middle" font-size="19" fill="#5B6E6C">The steps every medicine must take, and where the peptides sold online currently stand</text>


  <line x1="120" y1="640" x2="1280" y2="640" stroke="#C9BFAE" stroke-width="3"></line>


  <g fill="#E4DCCB">
    <rect x="130" y="580" width="170" height="60" rx="8"></rect>
    <rect x="320" y="520" width="170" height="120" rx="8"></rect>
    <rect x="510" y="460" width="170" height="180" rx="8"></rect>
    <rect x="700" y="400" width="170" height="240" rx="8"></rect>
    <rect x="890" y="340" width="170" height="300" rx="8"></rect>
    <rect x="1080" y="280" width="170" height="360" rx="8"></rect>
  </g>

  <g fill="#6FA19C">
    <rect x="130" y="580" width="170" height="8" rx="4"></rect>
    <rect x="320" y="520" width="170" height="8" rx="4"></rect>
    <rect x="510" y="460" width="170" height="8" rx="4"></rect>
    <rect x="700" y="400" width="170" height="8" rx="4"></rect>
    <rect x="890" y="340" width="170" height="8" rx="4"></rect>
    <rect x="1080" y="280" width="170" height="8" rx="4"></rect>
  </g>


  <g font-size="17" fill="#2F4A48" text-anchor="middle" font-weight="600">
    <text x="215" y="672">Cells in a dish</text>
    <text x="405" y="672">Animal studies</text>
    <text x="595" y="672">Small human pilots</text>
    <text x="785" y="672">Placebo-controlled trials</text>
    <text x="975" y="672">Large Phase 3 trials</text>
    <text x="1165" y="672">Regulator approval</text>
  </g>
  <g font-size="14" fill="#7A8A88" text-anchor="middle">
    <text x="215" y="694">Does it do anything?</text>
    <text x="405" y="694">Does it work in a body?</text>
    <text x="595" y="694">Is it safe in a few people?</text>
    <text x="785" y="694">Better than a sugar pill?</text>
    <text x="975" y="694">Thousands of patients</text>
    <text x="1165" y="694">Dose and risks on the label</text>
  </g>


  <defs>
    <g id="pill">
      <rect x="-70" y="-17" width="140" height="34" rx="17" fill="#E88C76"></rect>
    </g>
    <g id="pillteal">
      <rect x="-70" y="-17" width="140" height="34" rx="17" fill="#6FA19C"></rect>
    </g>
  </defs>


  <g text-anchor="middle" font-size="15" font-weight="600" fill="#F7F2E8">
    <use href="#pill" x="405" y="490"></use><text x="405" y="495">TB-500</text>
    <use href="#pill" x="405" y="448"></use><text x="405" y="453">GHK-Cu, injected</text>
  </g>


  <g text-anchor="middle" font-size="15" font-weight="600" fill="#F7F2E8">
    <use href="#pill" x="595" y="430"></use><text x="595" y="435">BPC-157</text>
  </g>


  <g text-anchor="middle" font-size="15" font-weight="600" fill="#F7F2E8">
    <use href="#pillteal" x="785" y="370"></use><text x="785" y="375">Collagen (skin)</text>
    <use href="#pill" x="785" y="328"></use><text x="785" y="333">CJC-1295</text>
    <use href="#pill" x="785" y="286"></use><text x="785" y="291">Ipamorelin</text>
  </g>

  <path d="M868 370 l7 8 l14 -16" stroke="#6FA19C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
  <g stroke="#B2543F" stroke-width="4" stroke-linecap="round">
    <line x1="870" y1="320" x2="886" y2="336"></line><line x1="886" y1="320" x2="870" y2="336"></line>
    <line x1="870" y1="278" x2="886" y2="294"></line><line x1="886" y1="278" x2="870" y2="294"></line>
  </g>


  <g text-anchor="middle" font-size="15" font-weight="600" fill="#F7F2E8">
    <use href="#pillteal" x="1150" y="250"></use><text x="1150" y="255">Tirzepatide</text>
    <use href="#pillteal" x="1150" y="208"></use><text x="1150" y="213">Semaglutide</text>
    <use href="#pillteal" x="1150" y="166"></use><text x="1150" y="171">Insulin</text>
  </g>

  <line x1="1238" y1="144" x2="1238" y2="280" stroke="#2F4A48" stroke-width="3" stroke-linecap="round"></line>
  <path d="M1238 144 h36 l-9 11 l9 11 h-36 z" fill="#6FA19C"></path>



  <g font-size="14" fill="#5B6E6C">
    <rect x="130" y="730" width="18" height="18" rx="9" fill="#E88C76"></rect><text x="156" y="744">Sold online, not approved</text>
    <rect x="360" y="730" width="18" height="18" rx="9" fill="#6FA19C"></rect><text x="386" y="744">Tested in placebo-controlled trials or approved</text>
  </g>
</svg>