<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="780" fill="none"></rect>
  <text x="700" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#2F4A48">What was actually in the vials</text>
  <text x="700" y="100" text-anchor="middle" font-size="19" fill="#5B6E6C">Three semaglutide vials bought online without a prescription, then tested in a lab</text>

  <defs>
    <g id="vial">
      <rect x="-30" y="-110" width="60" height="22" rx="4" fill="#2F4A48"></rect>
      <rect x="-40" y="-88" width="80" height="170" rx="14" fill="#FFFFFF" stroke="#2F4A48" stroke-width="4"></rect>
    </g>
  </defs>



  <rect x="80" y="150" width="380" height="440" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="270" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#2F4A48">Vial 1</text>
  <g transform="translate(270 340)">
    <use href="#vial"></use>
    <rect x="-36" y="69" width="72" height="9" rx="3" fill="#E88C76"></rect>
  </g>
  <text x="270" y="470" text-anchor="middle" font-size="15" fill="#7A8A88">Label: 99% pure</text>
  <text x="270" y="530" text-anchor="middle" font-size="48" font-weight="700" fill="#B2543F">7.7%</text>
  <text x="270" y="562" text-anchor="middle" font-size="16" fill="#5B6E6C">measured purity</text>


  <rect x="510" y="150" width="380" height="440" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="700" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#2F4A48">Vial 2</text>
  <g transform="translate(700 340)">
    <use href="#vial"></use>
    <rect x="-36" y="67" width="72" height="11" rx="3" fill="#E88C76"></rect>
  </g>
  <text x="700" y="470" text-anchor="middle" font-size="15" fill="#7A8A88">Label: 99% pure</text>
  <text x="700" y="530" text-anchor="middle" font-size="48" font-weight="700" fill="#B2543F">9.0%</text>
  <text x="700" y="562" text-anchor="middle" font-size="16" fill="#5B6E6C">measured purity</text>


  <rect x="940" y="150" width="380" height="440" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="1130" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#2F4A48">Vial 3</text>
  <g transform="translate(1130 340)">
    <use href="#vial"></use>
    <rect x="-36" y="60" width="72" height="18" rx="3" fill="#E88C76"></rect>
  </g>
  <text x="1130" y="470" text-anchor="middle" font-size="15" fill="#7A8A88">Label: 99% pure</text>
  <text x="1130" y="530" text-anchor="middle" font-size="48" font-weight="700" fill="#B2543F">14.4%</text>
  <text x="1130" y="562" text-anchor="middle" font-size="16" fill="#5B6E6C">measured purity</text>


  <rect x="80" y="620" width="1240" height="70" rx="12" fill="#E4DCCB"></rect>
  <text x="130" y="662" font-size="16" font-weight="600" fill="#2F4A48">In every vial:</text>
  <g stroke="#B2543F" stroke-width="3.5" stroke-linecap="round">
    <line x1="298" y1="650" x2="312" y2="664"></line><line x1="312" y1="650" x2="298" y2="664"></line>
    <line x1="708" y1="650" x2="722" y2="664"></line><line x1="722" y1="650" x2="708" y2="664"></line>
  </g>
  <g font-size="16" fill="#2F4A48">
    <text x="325" y="662">bacterial toxins</text>
    <text x="735" y="662">more drug than the label stated, an overdose risk</text>
  </g>

  <text x="700" y="740" text-anchor="middle" font-size="15" fill="#7A8A88">None of the sellers asked for a prescription. The FDA later sent warning letters to two of them.</text>
</svg>