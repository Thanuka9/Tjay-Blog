<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="780" fill="none"></rect>
  <text x="700" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#2F4A48">The advice that already has the evidence</text>
  <text x="700" y="100" text-anchor="middle" font-size="19" fill="#5B6E6C">What Harvard's Dr. Pieter Cohen recommends instead of a vial</text>


  <g>
    <rect x="90" y="160" width="280" height="420" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>

    <rect x="150" y="318" width="160" height="14" rx="7" fill="#2F4A48"></rect>
    <rect x="124" y="290" width="34" height="70" rx="8" fill="#6FA19C"></rect>
    <rect x="302" y="290" width="34" height="70" rx="8" fill="#6FA19C"></rect>
    <rect x="104" y="302" width="20" height="46" rx="6" fill="#2F4A48"></rect>
    <rect x="336" y="302" width="20" height="46" rx="6" fill="#2F4A48"></rect>
    <text x="230" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#2F4A48">Train</text>
    <text x="230" y="502" text-anchor="middle" font-size="16" fill="#5B6E6C">properly and regularly</text>
  </g>

  <g>
    <rect x="403" y="160" width="280" height="420" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>

    <circle cx="543" cy="325" r="78" fill="#E4DCCB"></circle>
    <circle cx="543" cy="325" r="58" fill="#FFFFFF"></circle>
    <circle cx="522" cy="318" r="22" fill="#6FA19C"></circle>
    <circle cx="562" cy="336" r="18" fill="#E88C76"></circle>
    <circle cx="556" cy="302" r="12" fill="#2F4A48"></circle>
    <text x="543" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#2F4A48">Eat well</text>
    <text x="543" y="502" text-anchor="middle" font-size="16" fill="#5B6E6C">a good diet, most days</text>
  </g>

  <g>
    <rect x="717" y="160" width="280" height="420" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>

    <circle cx="857" cy="325" r="70" fill="#6FA19C"></circle>
    <circle cx="885" cy="305" r="62" fill="#FFFFFF"></circle>
    <circle cx="812" cy="278" r="5" fill="#2F4A48"></circle>
    <circle cx="796" cy="300" r="3" fill="#2F4A48"></circle>
    <text x="857" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#2F4A48">Sleep</text>
    <text x="857" y="502" text-anchor="middle" font-size="16" fill="#5B6E6C">enough of it</text>
  </g>

  <g>
    <rect x="1030" y="160" width="280" height="420" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>

    <rect x="1120" y="285" width="36" height="110" rx="8" fill="#E88C76"></rect>
    <rect x="1128" y="260" width="20" height="34" rx="5" fill="#E88C76"></rect>
    <rect x="1172" y="330" width="90" height="18" rx="4" fill="#FFFFFF" stroke="#2F4A48" stroke-width="3"></rect>
    <rect x="1240" y="330" width="22" height="18" rx="4" fill="#E88C76"></rect>
    <g stroke="#B2543F" stroke-width="8" stroke-linecap="round">
      <line x1="1100" y1="250" x2="1280" y2="410"></line>
    </g>
    <text x="1170" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#2F4A48">Skip</text>
    <text x="1170" y="502" text-anchor="middle" font-size="16" fill="#5B6E6C">alcohol and nicotine</text>
  </g>

  <text x="700" y="660" text-anchor="middle" font-size="22" font-weight="700" fill="#2F4A48">None of these needs a trial, a prescription or a vial from a website.</text>
  <text x="700" y="700" text-anchor="middle" font-size="15" fill="#7A8A88">&#34;As a clinician, I do not recommend injecting yourself with peptides.&#34; Dr. Pieter Cohen, Harvard Medical School</text>
</svg>