<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="780" fill="none"></rect>
  <text x="700" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#2F4A48">BPC-157 in people: all the evidence so far</text>
  <text x="700" y="100" text-anchor="middle" font-size="19" fill="#5B6E6C">Three small studies, none with a placebo group</text>

  <defs>
    <g id="p">
      <circle cx="0" cy="-30" r="10"></circle>
      <path d="M-15 38 v-38 a15 15 0 0 1 30 0 v38 z"></path>
    </g>
  </defs>


  <rect x="80" y="150" width="390" height="430" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="275" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#2F4A48">Knee pain</text>
  <text x="275" y="222" text-anchor="middle" font-size="15" fill="#7A8A88">one injection into the knee</text>
  <g fill="#E88C76">
    <use href="#p" x="140" y="290"></use><use href="#p" x="194" y="290"></use><use href="#p" x="248" y="290"></use>
    <use href="#p" x="302" y="290"></use><use href="#p" x="356" y="290"></use><use href="#p" x="410" y="290"></use>
    <use href="#p" x="140" y="380"></use><use href="#p" x="194" y="380"></use><use href="#p" x="248" y="380"></use>
    <use href="#p" x="302" y="380"></use><use href="#p" x="356" y="380"></use>
  </g>
  <g fill="#D9CFBC"><use href="#p" x="410" y="380"></use></g>
  <text x="275" y="470" text-anchor="middle" font-size="40" font-weight="700" fill="#2F4A48">11 of 12</text>
  <text x="275" y="500" text-anchor="middle" font-size="16" fill="#5B6E6C">said their knee felt better</text>
  <text x="275" y="540" text-anchor="middle" font-size="14" fill="#7A8A88">No placebo · no standard measure of &#34;better&#34;</text>


  <rect x="505" y="150" width="390" height="430" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="700" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#2F4A48">Bladder pain</text>
  <text x="700" y="222" text-anchor="middle" font-size="15" fill="#7A8A88">one dose into the bladder</text>
  <g fill="#E88C76">
    <use href="#p" x="565" y="290"></use><use href="#p" x="619" y="290"></use><use href="#p" x="673" y="290"></use>
    <use href="#p" x="727" y="290"></use><use href="#p" x="781" y="290"></use><use href="#p" x="835" y="290"></use>
    <use href="#p" x="565" y="380"></use><use href="#p" x="619" y="380"></use><use href="#p" x="673" y="380"></use>
    <use href="#p" x="727" y="380"></use>
  </g>
  <g fill="#D9CFBC"><use href="#p" x="781" y="380"></use><use href="#p" x="835" y="380"></use></g>
  <text x="700" y="470" text-anchor="middle" font-size="40" font-weight="700" fill="#2F4A48">10 of 12</text>
  <text x="700" y="500" text-anchor="middle" font-size="16" fill="#5B6E6C">women said their symptoms went away</text>
  <text x="700" y="540" text-anchor="middle" font-size="14" fill="#7A8A88">No placebo · 12 women</text>


  <rect x="930" y="150" width="390" height="430" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="1125" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#2F4A48">Safety check</text>
  <text x="1125" y="222" text-anchor="middle" font-size="15" fill="#7A8A88">one dose into a vein, 2025</text>

  <path d="M1065 330 c-30 -30 -72 2 -40 34 l40 40 l40 -40 c32 -32 -10 -64 -40 -34 z" fill="#6FA19C"></path>

  <path d="M1185 300 c-28 0 -44 26 -44 52 c0 26 16 52 44 52 c12 0 18 -8 18 -18 c0 -8 -6 -12 -6 -22 c0 -10 6 -14 6 -24 c0 -10 -6 -18 -18 -18 z" fill="#6FA19C"></path>
  <g stroke="#6FA19C" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1050 420 l12 12 l24 -26"></path>
    <path d="M1170 420 l12 12 l24 -26"></path>
  </g>
  <text x="1125" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#2F4A48">No harm seen</text>
  <text x="1125" y="500" text-anchor="middle" font-size="16" fill="#5B6E6C">to heart or kidney function, short term</text>
  <text x="1125" y="540" text-anchor="middle" font-size="14" fill="#7A8A88">Pilot study · says nothing about benefit</text>


  <rect x="80" y="610" width="1240" height="70" rx="12" fill="#E4DCCB"></rect>
  <g font-size="16" fill="#2F4A48" font-weight="600">
    <text x="130" y="652">Still missing:</text>
  </g>
  <g stroke="#B2543F" stroke-width="3.5" stroke-linecap="round">
    <line x1="298" y1="640" x2="312" y2="654"></line><line x1="312" y1="640" x2="298" y2="654"></line>
    <line x1="608" y1="640" x2="622" y2="654"></line><line x1="622" y1="640" x2="608" y2="654"></line>
    <line x1="933" y1="640" x2="947" y2="654"></line><line x1="947" y1="640" x2="933" y2="654"></line>
  </g>
  <g font-size="16" fill="#2F4A48">
    <text x="325" y="652">a placebo group</text>
    <text x="635" y="652">a proven human dose</text>
    <text x="960" y="652">long-term safety data</text>
  </g>

  <text x="700" y="730" text-anchor="middle" font-size="15" fill="#7A8A88">Reviewers concluded the knee results cannot be credited to BPC-157.</text>
</svg>