    <text x="255" y="560">Amino acids</text>
    <text x="700" y="560">Peptide</text>
    <text x="1130" y="560">Protein</text>
  </g>
  <g font-size="16" fill="#5B6E6C" text-anchor="middle">
    <text x="255" y="588">the building blocks</text>
    <text x="700" y="588">a short chain</text>
    <text x="1130" y="588">a long chain, folded into a shape</text>
