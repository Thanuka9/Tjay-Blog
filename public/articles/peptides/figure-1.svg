<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="780" fill="none"></rect>
  <text x="700" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#2F4A48">What is a peptide?</text>
  <text x="700" y="100" text-anchor="middle" font-size="19" fill="#5B6E6C">Amino acids are the building blocks. A short chain is a peptide; a long, folded chain is a protein.</text>

