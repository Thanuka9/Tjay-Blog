<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="780" fill="none"></rect>
  <text x="700" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#2F4A48">Collagen peptides: what is known, and where it stops</text>
  <text x="700" y="100" text-anchor="middle" font-size="19" fill="#5B6E6C">Getting into the body is proven. What happens next is not.</text>


  <rect x="80" y="170" width="360" height="460" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="260" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#2F4A48">A supplement</text>

  <rect x="190" y="286" width="140" height="170" rx="16" fill="#6FA19C"></rect>
  <rect x="182" y="258" width="156" height="40" rx="10" fill="#2F4A48"></rect>
  <rect x="206" y="330" width="108" height="78" rx="8" fill="#F7F2E8"></rect>
  <text x="260" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#2F4A48">COLLAGEN</text>
  <text x="260" y="381" text-anchor="middle" font-size="14" font-weight="700" fill="#2F4A48">PEPTIDES</text>
  <text x="260" y="399" text-anchor="middle" font-size="11" fill="#7A8A88">powder</text>

  <path d="M350 440 h40 a20 16 0 0 1 -40 0 z" fill="#E4DCCB"></path>
  <rect x="384" y="412" width="8" height="28" rx="4" fill="#E4DCCB" transform="rotate(30 388 426)"></rect>
  <text x="260" y="530" text-anchor="middle" font-size="30" font-weight="700" fill="#2F4A48">A daily powder</text>
  <text x="260" y="564" text-anchor="middle" font-size="17" fill="#5B6E6C">about 5 grams, most days</text>


  <g stroke="#2F4A48" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="455" y1="400" x2="505" y2="400"></line>
    <path d="M491 386 l14 14 l-14 14"></path>
  </g>


  <rect x="520" y="170" width="360" height="460" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="700" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#2F4A48">Reaches the blood</text>

  <path d="M700 270 c-40 60 -70 95 -70 135 a70 70 0 0 0 140 0 c0 -40 -30 -75 -70 -135 z" fill="#E88C76"></path>
  <circle cx="676" cy="412" r="9" fill="#F7F2E8"></circle>
  <text x="700" y="530" text-anchor="middle" font-size="30" font-weight="700" fill="#2F4A48">Confirmed</text>
  <text x="700" y="564" text-anchor="middle" font-size="17" fill="#5B6E6C">measured in people</text>
  <path d="M676 594 l14 14 l32 -34" stroke="#6FA19C" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>


  <g stroke="#B2543F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8">
    <line x1="895" y1="400" x2="940" y2="400"></line>
  </g>
  <path d="M931 386 l14 14 l-14 14" stroke="#B2543F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>


  <rect x="960" y="170" width="360" height="460" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="1140" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#2F4A48">Does it work?</text>
  <text x="1140" y="430" text-anchor="middle" font-size="150" font-weight="700" fill="#B2543F">?</text>
  <text x="1140" y="530" text-anchor="middle" font-size="30" font-weight="700" fill="#2F4A48">Not yet certain</text>
  <text x="1140" y="564" text-anchor="middle" font-size="17" fill="#5B6E6C">skin: some evidence · tendons: weak</text>

  <text x="700" y="730" text-anchor="middle" font-size="15" fill="#7A8A88">Collagen is the only peptide in this article that has been tested against a placebo in people.</text>
</svg>