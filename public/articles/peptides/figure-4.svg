<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="780" fill="none"></rect>
  <text x="700" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#2F4A48">GHK-Cu: same peptide, two very different products</text>
  <text x="700" y="100" text-anchor="middle" font-size="19" fill="#5B6E6C">The cream has been tested in people. The injection has not.</text>


  <rect x="120" y="160" width="540" height="500" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="390" y="212" text-anchor="middle" font-size="24" font-weight="700" fill="#2F4A48">As a cream</text>


  <rect x="310" y="290" width="160" height="150" rx="20" fill="#6FA19C"></rect>
  <rect x="300" y="258" width="180" height="46" rx="10" fill="#2F4A48"></rect>
  <rect x="335" y="340" width="110" height="56" rx="8" fill="#F7F2E8"></rect>
  <text x="390" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#2F4A48">GHK-Cu</text>

  <text x="390" y="520" text-anchor="middle" font-size="36" font-weight="700" fill="#2F4A48">A few small trials</text>
  <text x="390" y="556" text-anchor="middle" font-size="17" fill="#5B6E6C">firmer skin, fewer wrinkles</text>

  <path d="M365 600 l14 14 l32 -34" stroke="#6FA19C" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>


  <rect x="740" y="160" width="540" height="500" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="2"></rect>
  <text x="1010" y="212" text-anchor="middle" font-size="24" font-weight="700" fill="#2F4A48">As an injection</text>


  <g transform="translate(1010 350) rotate(-30)">
    <rect x="-150" y="-26" width="230" height="52" rx="10" fill="#FFFFFF" stroke="#2F4A48" stroke-width="4"></rect>
    <rect x="-142" y="-17" width="110" height="34" rx="6" fill="#E88C76"></rect>
    <rect x="80" y="-10" width="46" height="20" fill="#2F4A48"></rect>
    <rect x="126" y="-3" width="50" height="6" fill="#2F4A48"></rect>
    <rect x="-182" y="-36" width="32" height="72" rx="6" fill="#2F4A48"></rect>
    <rect x="-224" y="-8" width="44" height="16" rx="4" fill="#2F4A48"></rect>
  </g>

  <text x="1010" y="520" text-anchor="middle" font-size="36" font-weight="700" fill="#B2543F">0 trials</text>
  <text x="1010" y="556" text-anchor="middle" font-size="17" fill="#5B6E6C">safety inside the body unknown</text>

  <g stroke="#B2543F" stroke-width="7" stroke-linecap="round">
    <line x1="992" y1="586" x2="1028" y2="622"></line><line x1="1028" y1="586" x2="992" y2="622"></line>
  </g>

  <text x="700" y="730" text-anchor="middle" font-size="15" fill="#7A8A88">Neither product is approved as a medicine.</text>
</svg>