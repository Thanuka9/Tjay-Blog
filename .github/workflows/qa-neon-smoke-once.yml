name: One-time Neon production CRUD smoke

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/qa-neon-smoke-once.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run production QA route
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          body=$(curl -sSL --max-time 60 -w '\nHTTP_STATUS=%{http_code}' https://theabyssos.com/api/qa-neon-smoke-once)
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"ok":true'
          printf '%s' "$body" | grep -q '"postCreateReadUpdateDelete":"PASS"'
          printf '%s' "$body" | grep -q '"sharedRead":"PASS"\|"readShared":"PASS"'
