name: One-time Neon production smoke test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/neon-production-smoke-once.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show Neon media runtime result
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          body=$(curl -sSL --max-time 30 -w '\nHTTP_STATUS=%{http_code}' https://theabyssos.com/api/neon-media-health-once)
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"ok":true'
