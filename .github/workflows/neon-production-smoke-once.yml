name: One-time Neon production smoke test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/neon-production-smoke-once.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Neon OIDC and production response
        shell: bash
        run: |
          set -euo pipefail
          sleep 25
          echo '--- NEON HEALTH ---'
          curl -sS --max-time 30 -w '\nHTTP_STATUS=%{http_code}\n' https://theabyssos.com/api/neon-health-once
          echo '--- HOME STATUS ---'
          curl -sS --max-time 30 -o /tmp/home.html -w 'HTTP_STATUS=%{http_code}\n' https://theabyssos.com/
          echo '--- END ---'
