name: One-time Neon production smoke test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/neon-production-smoke-once.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Neon data and media paths
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          health=$(curl -fsSL --max-time 30 https://theabyssos.com/api/neon-health-once)
          printf '%s\n' "$health"
          printf '%s' "$health" | grep -q '"ok":true'
          media=$(curl -fsSL --max-time 30 https://theabyssos.com/api/neon-media-health-once)
          printf '%s\n' "$media"
          printf '%s' "$media" | grep -q '"ok":true'
          curl -fsSL --max-time 30 https://theabyssos.com/ -o /tmp/home.html
          grep -qi 'The Abyss' /tmp/home.html
          curl -fsSL --max-time 30 https://theabyssos.com/current-issue -o /tmp/issue.html
          grep -qi 'Issue' /tmp/issue.html
          curl -fsSL --max-time 30 https://theabyssos.com/articles/are-peptides-the-real-future-of-longevity -o /tmp/article.html
          grep -qi 'Are peptides' /tmp/article.html
          echo 'PRODUCTION_NEON_DATA_MEDIA_SMOKE=PASS'
