name: One-time Neon production smoke test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/neon-production-smoke-once.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify Neon-backed production
        shell: bash
        run: |
          set -euo pipefail
          check_json() {
            local url="$1"
            for i in {1..18}; do
              body=$(curl -sSL --max-time 30 "$url" || true)
              if printf '%s' "$body" | grep -q '"ok":true'; then
                printf '%s\n' "$body"
                return 0
              fi
              sleep 5
            done
            printf 'FAILED: %s\n' "$url" >&2
            return 1
          }
          check_page() {
            local url="$1"
            local needle="$2"
            for i in {1..18}; do
              if curl -fsSL --max-time 30 "$url" -o /tmp/page.html && grep -qi "$needle" /tmp/page.html; then
                return 0
              fi
              sleep 5
            done
            printf 'FAILED: %s\n' "$url" >&2
            return 1
          }
          check_json https://theabyssos.com/api/neon-health-once
          check_json https://theabyssos.com/api/neon-media-health-once
          check_page https://theabyssos.com/ 'The Abyss'
          check_page https://theabyssos.com/current-issue 'Issue'
          check_page https://theabyssos.com/articles/are-peptides-the-real-future-of-longevity 'Are peptides'
          echo 'PRODUCTION_NEON_CUTOVER=PASS'
