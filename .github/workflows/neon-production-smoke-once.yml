name: One-time Neon production smoke test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/neon-production-smoke-once.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Neon media path
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          health=$(curl -fsSL --max-time 30 https://theabyssos.com/api/neon-health-once)
          printf '%s\n' "$health"
          printf '%s' "$health" | grep -q '"ok":true'
          media=$(curl -sSL --max-time 30 -w '\nHTTP_STATUS=%{http_code}' https://theabyssos.com/api/neon-media-health-once)
          printf '%s\n' "$media"
          printf '%s' "$media" | grep -q '"ok":true'
