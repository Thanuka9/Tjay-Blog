name: One-time Blob to Neon migration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/neon-migrate-once.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production deployment and run migration
        shell: bash
        run: |
          set -euo pipefail
          url="https://theabyssos.com/api/neon-migrate-once"
          for attempt in $(seq 1 18); do
            body=$(curl -fsS --connect-timeout 10 --max-time 60 "$url" 2>/tmp/migrate-error || true)
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "$body"
              exit 0
            fi
            echo "Migration endpoint not ready yet (attempt $attempt/18)."
            sleep 10
          done
          echo "Migration did not complete."
          cat /tmp/migrate-error || true
          exit 1
