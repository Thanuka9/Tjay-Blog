name: Neon migration check

on:
  push:
    branches: [neon-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neon-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Neon migration"
          git push origin HEAD:neon-migration
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Next types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
